# Basic Memory MCP server and the SilverBullet web UI on the same notes folder. The same file runs locally
# (make local-up) and on the VM (make deploy). Defaults are the local values; on the VM, scripts/deploy-stack.sh writes
# absolute paths and SB_USER into .env.
name: basic-memory
# Docker's json-file driver keeps every line by default, and Basic Memory logs one uvicorn line per MCP request.
# Rotate at 10 MB and keep 3 files: at most 30 MB per container. Docker applies it when compose recreates a container.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  basic-memory:
    image: ghcr.io/basicmachines-co/basic-memory:0.23.2@sha256:939f1173d96626c280763e14622f2381d49fbbb7db17cae2e832f4f639405643
    container_name: basic-memory-server
    # The image default is `--transport sse`; agents connect over streamable HTTP at /mcp.
    command: ["basic-memory", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000", "--path", "/mcp"]
    # Basic Memory has no authentication: never bind anything but loopback.
    ports:
      - "127.0.0.1:${BM_PORT:-8737}:8000"
    volumes:
      - "${BM_KNOWLEDGE_DIR:-./.local-data/knowledge}:/app/data"
      - "${BM_CONFIG_DIR:-./.local-data/config}:/home/appuser/.basic-memory"
    environment:
      BASIC_MEMORY_DEFAULT_PROJECT: main
      BASIC_MEMORY_INDEX_CHANGES: "true"
      BASIC_MEMORY_LOG_LEVEL: INFO
      # On the 1 GB VM the post-write vector sync and the embedding model keep the server busy for minutes. Off, a write
      # only indexes text and search_type defaults to text. 0.24.0 removed this switch, so the image stays on 0.23.2.
      BASIC_MEMORY_SEMANTIC_SEARCH_ENABLED: "false"
    healthcheck:
      # Upstream checks `basic-memory --version`, which passes even when the server is down.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A cold start on the e2-micro VM took 161-192s. Failed checks inside start_period do not count, so a slow
      # start no longer turns the container unhealthy (which fails `up --wait` at once); start_interval still
      # marks it healthy within seconds of listening.
      start_period: 300s
      start_interval: 2s
    networks: [basic-memory]
    restart: unless-stopped
    logging: *bounded-logging
  silverbullet:
    # Web UI for the notes. It mounts only the notes folder, never the Basic Memory database or config.
    image: ghcr.io/silverbulletmd/silverbullet:2.12.1-slim@sha256:7e24c16d31a3f4b4a4832ed64ec585e605a1e275b7c35917d385176f0b40415c
    container_name: silverbullet-server
    # Loopback only: Tailscale Serve publishes it inside the tailnet on https port 8443.
    ports:
      - "127.0.0.1:${SB_PORT:-3000}:3000"
    volumes:
      - "${BM_KNOWLEDGE_DIR:-./.local-data/knowledge}/basic-memory:/data"
    environment:
      # Without a login, any web page the browser opens could run shell commands and use the proxy through this port.
      SB_USER: ${SB_USER:?set SB_USER in the main checkout .env, see .env.example}
      SB_SHELL_BACKEND: "off"
      SB_RUNTIME_API: "0"
    # Basic Memory creates the notes folder and reads the notes .gitignore before SilverBullet writes anything.
    depends_on:
      basic-memory:
        condition: service_healthy
    healthcheck:
      # /.ping is on SilverBullet's list of paths open without a login; the image default /.instance is not on it.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/.ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks: [silverbullet]
    restart: unless-stopped
    logging: *bounded-logging
  # The claude.ai web connector (BM_WEB=on): COMPOSE_PROFILES turns these on (make local-* passes web; the VM .env sets
  # web,tunnel). Their variables read ${VAR:-}: compose expands disabled services too, and ${VAR:?} would stop every
  # compose call of a BM_WEB=off install. gateway.py checks the values when it starts.
  gateway:
    # OAuth gateway: GitHub login of one owner (numeric id), 18 allowed tools, audit log. Its dependencies are
    # hash-pinned in gateway/requirements.txt; boot.py installs them into the gateway-deps volume on the first start.
    image: python:3.12.15-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
    container_name: gateway-server
    profiles: [web]
    # boot.py installs the dependencies as root when requirements.txt changed, then runs gateway.py as uid 1000.
    command: ["python", "/app/boot.py"]
    working_dir: /app
    # Loopback only: cloudflared reaches it over the web network; the port is for make local-verify and make verify.
    ports:
      - "127.0.0.1:${BM_WEB_PORT:-8738}:8080"
    volumes:
      - "./gateway:/app:ro"
      - "${BM_WEB_DATA_DIR:-./.local-data/gateway}:/data"
      - "gateway-deps:/deps"
    environment:
      BM_WEB_BASE_URL: ${BM_WEB_BASE_URL:-}
      BM_WEB_GITHUB_USER_ID: ${BM_WEB_GITHUB_USER_ID:-}
      BM_WEB_GITHUB_CLIENT_ID: ${BM_WEB_GITHUB_CLIENT_ID:-}
      BM_WEB_GITHUB_CLIENT_SECRET: ${BM_WEB_GITHUB_CLIENT_SECRET:-}
      BM_WEB_JWT_KEY: ${BM_WEB_JWT_KEY:-}
      # The sha256 of the gateway runtime files (vm_env in scripts/lib/vm.sh writes it into the VM .env). The code is
      # bind-mounted, so without it a deploy that changed only the code or its dependencies keeps the old container.
      BM_WEB_CODE_SHA256: ${BM_WEB_CODE_SHA256:-}
      # The client registration and token store (FastMCP's default layout under FASTMCP_HOME).
      FASTMCP_HOME: /data
      PYTHONPATH: /deps/site
      # /app is read-only.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      basic-memory:
        condition: service_healthy
    healthcheck:
      # The authorization server metadata needs no backend: it must answer while Basic Memory restarts (claude.ai
      # gives discovery 10 s).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/.well-known/oauth-authorization-server', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads and installs the pinned dependencies before the server listens.
      start_period: 300s
      start_interval: 2s
    networks: [basic-memory, web]
    restart: unless-stopped
    logging: *bounded-logging
  cloudflared:
    # Outbound tunnel to Cloudflare: a remotely managed tunnel whose public hostname and service (http://gateway:8080)
    # are set in the Cloudflare dashboard. It only dials out and publishes no port.
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    container_name: cloudflared-tunnel
    profiles: [tunnel]
    # The image entrypoint is `cloudflared --no-autoupdate`. The metrics server listens only inside the container.
    command: ["tunnel", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN: ${BM_WEB_TUNNEL_TOKEN:-}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # `tunnel ready` asks the metrics server's /ready, which answers 200 once a connection to Cloudflare is up.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    networks: [web]
    restart: unless-stopped
    logging: *bounded-logging
networks:
  basic-memory:
  silverbullet:
  web:
volumes:
  # The gateway's installed dependencies: re-installable, so they stay out of the data root and make backup.
  gateway-deps:
